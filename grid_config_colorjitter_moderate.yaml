# Grid search configuration for ColorJitter (Moderate Intensity)
project: pepper-segmentation-grid-colorjitter-moderate
method: grid
parameters:
  image_size:
    values:
    - [640, 360]
  batch_size:
    value: 3
  learning_rate:
    value: 2e-4
  epochs:
    value: 100
  log_freq:
    value: 10
  colorjitter_prob:
    values:
    - 0.5
  brightness:
    values:
    - [0.7, 1.3]
  contrast:
    values:
    - [0.7, 1.3]
  saturation:
    values:
    - [0.7, 1.3]
  hue:
    values:
    - [-0.05, 0.05]
