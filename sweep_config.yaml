program: run_sweep_training.py
project: pepper-segmentation-sweep
method: grid
metric:
  goal: maximize
  name: best_mean_iou
parameters:
  cutmix_alpha:
    values: [0.5, 1.0, 1.5]
  cutmix_prob:
    values: [0.3, 0.5, 0.7]
  learning_rate:
    value: 1e-4
  batch_size:
    value: 3
  epochs:
    value: 100
  log_freq:
    value: 10
early_terminate:
  type: hyperband
  min_iter: 15
  max_iter: 100
