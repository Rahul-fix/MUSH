program: train.py
method: grid
metric:
  goal: maximize
  name: best_mean_iou
parameters:
  cutmix_alpha:
    values: [0.5, 1.0, 1.5]
  cutmix_prob:
    values: [0.3, 0.5, 0.7]
  learning_rate:
    values: [2e-4]
  batch_size:
    values: [3]
  epochs:
    value: 100
  log_freq:
    value: 10
  project_name:
    value: "pepper-segmentation-sweep"
early_terminate:
  type: hyperband
  min_iter: 15
  max_iter: 100
