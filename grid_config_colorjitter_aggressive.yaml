# Grid search configuration for ColorJitter (Aggressive Intensity)
project: pepper-segmentation-grid-colorjitter-aggressive
method: grid
parameters:
  image_size:
    values:
    - [640, 360]
  batch_size:
    value: 3
  learning_rate:
    value: 2e-4
  epochs:
    value: 100
  log_freq:
    value: 10
  colorjitter_prob:
    values:
    - 0.5
  brightness:
    values:
    - "0.65 1.35"
  contrast:
    values:
    - "0.65 1.35"
  saturation:
    values:
    - "0.65 1.35"
  hue:
    values:
    - "-0.05 0.05"
